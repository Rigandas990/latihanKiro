<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Diri</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 50px 20px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #533483 100%);
      background-attachment: fixed;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, #a855f7, #3b82f6);
      top: -120px;
      left: -100px;
    }

    body::after {
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, #ec4899, #f97316);
      bottom: -100px;
      right: -80px;
    }

    .container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 36px 40px;
      width: fit-content;
      box-shadow:
        0 8px 40px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    h2 {
      text-align: center;
      color: #fff;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: 0.4px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
    }

    h3 {
      color: rgba(255, 255, 255, 0.6);
      font-size: 11px;
      font-weight: 600;
      margin: 28px 0 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    h3:first-of-type {
      margin-top: 0;
    }

    table {
      border-collapse: collapse;
      width: 500px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    tr {
      transition: background 0.2s;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.1);
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      font-weight: 300;
      background: rgba(255, 255, 255, 0.04);
    }

    tr:last-child td {
      border-bottom: none;
    }

    td:first-child {
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      letter-spacing: 0.2px;
      width: 190px;
      border-right: 1px solid rgba(255, 255, 255, 0.07);
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      margin: 24px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Data Diri</h2>

    <h3>John</h3>
    <table>
      <tr>
        <td>Nama</td>
        <td>John</td>
      </tr>
      <tr>
        <td>Jenis Kelamin</td>
        <td>Laki-laki</td>
      </tr>
      <tr>
        <td>Tempat, Tgl Lahir</td>
        <td>New York, 15 Maret 1998</td>
      </tr>
      <tr>
        <td>Alamat</td>
        <td>Jl. Contoh No. 2, Jakarta</td>
      </tr>
      <tr>
        <td>No. Telepon</td>
        <td>08198765432</td>
      </tr>
      <tr>
        <td>Email</td>
        <td>john@email.com</td>
      </tr>
      <tr>
        <td>Pekerjaan</td>
        <td>Programmer</td>
      </tr>
    </table>

  </div>
</body>
</html>
